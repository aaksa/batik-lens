<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kain · Batik Lens</title>
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@400;600&family=Noto+Sans+Javanese:wght@400;700&family=Noto+Naskh+Arabic:wght@400;700&display=swap">
  <link rel="stylesheet" href="style.css?v=12">
</head>
<body class="kain-page">
  <canvas id="clothCanvas" aria-label="The current batik on a hanging cloth. Tap to ripple it."></canvas>

  <header class="kain-label" id="label">
    <span class="kain-mark" lang="jv">ꦏꦲꦶꦤ꧀</span>
    <h1 id="kainName"></h1>
    <p class="kain-place" id="kainPlace"></p>
    <p class="kain-about" id="kainAbout"></p>
  </header>

  <nav class="kain-bar" aria-label="Batik">
    <div class="kain-actions">
      <span class="kain-sync" id="sync" role="status"></span>
      <button type="button" id="infoToggle" aria-pressed="true">Label</button>
      <button type="button" id="fullscreen">Fullscreen</button>
    </div>
  </nav>

  <script src="lenses.js?v=1"></script>
  <script src="batik.js?v=14"></script>
  <script type="module" src="kain.js?v=4"></script>
</body>
</html>
